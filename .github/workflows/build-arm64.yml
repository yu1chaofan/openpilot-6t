name: build-arm64

# openpilot/sunnypilot 原生部分编译 (OnePlus 6T / aarch64)
#
# 为什么需要 arm64 runner:
#   SConstruct 只认 comma_arm64/aarch64/x86_64/Darwin, 无交叉编译分支,
#   依赖 comma-deps-* 是预编译 wheel, 无法在 x86 上重新编译出 arm64。
#   => 必须跑在原生 aarch64 上。
#
# runs-on 二选一:
#   ubuntu-24.04-arm    GitHub 托管 arm64 (public 仓库免费)
#   [self-hosted, arm64] 自建 (如 6T 上的 Termux runner)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '运行环境: gh-arm64(托管) 或 self-hosted(自建)'
        required: false
        default: 'gh-arm64'
      comma_hardware:
        description: '伪装 comma 硬件 (创建 /AGNOS, 启用 cortex-a57 与 camerad)'
        required: false
        default: 'true'
      scons_jobs:
        description: '并发数'
        required: false
        default: '4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: write

env:
  UV_VERSION: '0.5.11'
  SRC_REPO: 'https://jihulab.com/mr-one/openpilot.git'
  SRC_BRANCH: '3xl'

jobs:
  build:
    runs-on: ${{ (inputs.runner == 'self-hosted') && fromJSON('["self-hosted","arm64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240

    steps:
      - name: Report runner
        run: |
          echo "runner: ${{ inputs.runner || 'gh-arm64' }}"
          uname -m
          nproc
          free -h || true

      - name: Checkout (workflow repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Fetch source tree
        run: |
          set -euo pipefail
          # jihulab 大仓库 clone 经常在中途断流(curl 92 / early EOF),
          # 用 archive 打包下载替代 git clone, 失败则重试并回退到 clone。
          fetch_archive() {
            local url="$1"
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 900 \
                 -o src.tar.gz "$url" && return 0
            return 1
          }

          ok=0
          for u in \
            "https://jihulab.com/mr-one/openpilot/-/archive/${SRC_BRANCH}/openpilot-${SRC_BRANCH}.tar.gz" \
            "https://jihulab.com/mr-one/openpilot/-/archive/${SRC_BRANCH}/openpilot-${SRC_BRANCH}.zip"; do
            echo "trying: $u"
            if fetch_archive "$u"; then ok=1; echo "downloaded $(stat -c%s src.tar.gz) bytes"; break; fi
            rm -f src.tar.gz
          done

          if [ "$ok" = "1" ]; then
            mkdir -p .src
            tar xzf src.tar.gz -C .src --strip-components=1 && rm -f src.tar.gz
            echo "SRC_COMMIT=$(cat .src/_check_out.txt 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"
          else
            echo "archive failed, falling back to git clone"
            git config --global http.postBuffer 524288000
            git config --global http.version HTTP/1.1
            git clone --depth 1 --single-branch --branch "$SRC_BRANCH" "$SRC_REPO" .src
            echo "SRC_COMMIT=$(git -C .src rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          echo "source: $(cat $GITHUB_ENV | grep SRC_COMMIT)"

          # 源码覆盖到工作目录 (保留 .github 里的 workflow)
          rsync -a --exclude '.git' .src/ ./
          rm -rf .src

          # --- 修复源仓库缺失的包目录 ---
          # tinygrad_repo/pyproject.toml 的 packages 列表里声明了
          # tinygrad.runtime.support.mlx, 但源仓库未提交该目录, 导致
          # setuptools.build_meta.build_editable 直接失败。
          # 补齐为最小可导入占位, 不影响 CPU/QCOM 后端。
          MLX_DIR="tinygrad_repo/tinygrad/runtime/support/mlx"
          if [ ! -d "$MLX_DIR" ]; then
            mkdir -p "$MLX_DIR"
            printf '%s\n' \
              '"""Minimal placeholder for the MLX backend package.' \
              'The upstream tree ships this directory empty; setuptools only' \
              'requires it to exist to satisfy the declared package list."""' \
              > "$MLX_DIR/__init__.py"
            echo "patched: created $MLX_DIR/__init__.py"
          fi
          ls -la "$MLX_DIR"

          ls -la | head -20

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang lld pkg-config \
            libssl-dev libffi-dev zlib1g-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdrm-dev \
            python3 python3-venv python3-dev rsync zstd

      - name: Setup uv + python
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # 3.12.13 在 aarch64 无预编译包, 用 3.12 系列
          uv python install 3.12
          uv python list | head

      - name: Sync dependencies
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
          export UV_PYTHON_PREFERENCE=managed
          export UV_PYTHON=3.12
          uv sync --frozen --no-dev --python 3.12
          source .venv/bin/activate
          python -c "import platform,sys; print('py:',sys.version.split()[0],'arch:',platform.machine())"

      - name: Enable comma hardware mode
        run: |
          set -euo pipefail
          if [ "${{ inputs.comma_hardware }}" = "true" ]; then
            sudo touch /AGNOS
            echo "COMMA_HARDWARE=1 (/AGNOS created) -> cortex-a57 + camerad"
          else
            echo "COMMA_HARDWARE=0 (generic aarch64)"
          fi

      - name: Build
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          source .venv/bin/activate
          export PYTHONPATH="${PYTHONPATH:-}:$PWD"
          export CI=1
          scons -j"${{ inputs.scons_jobs }}" --minimal 2>&1 | tee /tmp/build.log | tail -120

      - name: Smoke test
        if: success()
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH="${PYTHONPATH:-}:$PWD"
          echo "=== 产物清单 ==="
          find . -path ./.git -prune -o -path ./.venv -prune -o \
            -type f \( -name '*.so' -o -name '*.a' \) -print | head -40
          echo "=== 关键二进制架构校验 ==="
          for f in $(find . -maxdepth 4 -type f -name '*.so' | head -5); do
            file "$f"
          done
          echo "=== import 冒烟 ==="
          python -c "import openpilot.common.params" 2>&1 | head -5 || true

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -path ./.git -prune -o -path ./.venv -prune -o \
            -type f \( -name '*.so' -o -name '*.a' -o -name '*.elf' \) -print \
            | grep -vE 'site-packages|third_party/(acados|eigen)/' \
            | while read -r f; do
                d="dist/$(dirname "$f")"; mkdir -p "$d"; cp "$f" "$d/" 2>/dev/null || true
              done
          echo "files: $(find dist -type f | wc -l)"
          du -sh dist || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpilot-native-${{ inputs.runner || 'gh-arm64' }}-${{ env.SRC_COMMIT }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.runner || 'gh-arm64' }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup /AGNOS
        if: always()
        run: sudo rm -f /AGNOS || true
