name: build-arm64

# dragonpilot (openpilot fork) 原生编译 —— OnePlus 6T / aarch64
#
# 为什么必须原生 aarch64:
#   SConstruct 只认 comma_arm64/aarch64/x86_64/Darwin, 没有交叉编译分支;
#   依赖 comma-deps-* 是预编译 wheel, 无法在 x86 上重建 arm64。
#   => 用 GitHub 托管 arm64 runner (public 仓库免费)。
#
# 源码来源: dragonpilot/dragonpilot (仓库 ~10GB, 用 archive 下载, 不用 git clone)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'dragonpilot 分支/标签'
        required: false
        default: 'pre-build'
      comma_hardware:
        description: '伪装 comma 硬件 (创建 /TICI, 启用 camerad 与设备专用编译)'
        required: false
        default: 'true'
      scons_jobs:
        description: '并发数'
        required: false
        default: '4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: write

env:
  UV_VERSION: '0.5.11'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Report runner
        run: |
          uname -m; nproc; free -h || true
          df -h / | tail -1

      - name: Checkout (workflow only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Fetch dragonpilot source
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'pre-build' }}"
          echo "target ref: $REF"
          URL="https://github.com/dragonpilot/dragonpilot/archive/refs/heads/${REF}.tar.gz"

          ok=0
          for attempt in 1 2 3; do
            echo "=== attempt $attempt: $URL"
            if curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                    --connect-timeout 30 --max-time 1800 \
                    -o src.tar.gz "$URL"; then ok=1; break; fi
            rm -f src.tar.gz; sleep 10
          done
          # heads 失败则试 tags
          if [ "$ok" != "1" ]; then
            URL="https://github.com/dragonpilot/dragonpilot/archive/refs/tags/${REF}.tar.gz"
            echo "=== fallback tags: $URL"
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 1800 -o src.tar.gz "$URL" && ok=1
          fi
          [ "$ok" = "1" ] || { echo "::error::failed to download source"; exit 1; }

          echo "downloaded: $(stat -c%s src.tar.gz) bytes"
          mkdir -p .src
          tar xzf src.tar.gz -C .src --strip-components=1
          rm -f src.tar.gz
          echo "SRC_REF=$REF" >> "$GITHUB_ENV"
          ls .src | head -20

          # 覆盖到工作目录, 保留 .github/workflows
          rsync -a --exclude '.git' .src/ ./
          rm -rf .src

      - name: Patch missing tinygrad package dir
        run: |
          set -euo pipefail
          # tinygrad_repo/pyproject.toml 的 packages 声明了
          # tinygrad.runtime.support.mlx, 但仓库未提交该目录,
          # setuptools.build_meta.build_editable 会因此直接失败。
          for d in tinygrad_repo/tinygrad/runtime/support/mlx; do
            if [ -d "$(dirname "$d")" ] && [ ! -d "$d" ]; then
              mkdir -p "$d"
              printf '"""Placeholder for the MLX backend package (not shipped)."""\n' > "$d/__init__.py"
              echo "patched: $d"
            fi
          done
          ls -la tinygrad_repo/tinygrad/runtime/support/ 2>/dev/null | head || echo "no tinygrad_repo"

      - name: Fetch ONNX models from pre-build branch
        run: |
          set -euo pipefail
          # 0.11.1 发布分支不带 ONNX(为减小体积), 编译 modeld 需要它。
          # 官方 pre-build 分支保留了全部 ONNX, 直接补齐。
          MDIR="selfdrive/modeld/models"
          mkdir -p "$MDIR"
          if [ "${SRC_REF:-}" = "pre-build" ]; then
            echo "source is pre-build: ONNX models and .cc sources already included"
            ls -la "$MDIR"/*.onnx 2>/dev/null | head -6 || true
            exit 0
          fi
          miss=0
          for m in driving_vision.onnx driving_policy.onnx dmonitoring_model.onnx \
                   big_driving_vision.onnx big_driving_policy.onnx; do
            if [ -s "$MDIR/$m" ]; then echo "have $m"; continue; fi
            echo "fetching $m"
            url="https://raw.githubusercontent.com/dragonpilot/dragonpilot/pre-build/${MDIR}/${m}"
            if ! curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                        --connect-timeout 30 --max-time 900 -o "$MDIR/$m" "$url"; then
              echo "WARN: failed to fetch $m"; miss=$((miss+1)); rm -f "$MDIR/$m"
            fi
          done
          # big_ 模型是可选的(usbgpu), 缺了不影响主路径
          echo "=== models ==="
          ls -la "$MDIR"/*.onnx 2>/dev/null | head -10 || true
          echo "missing(optional ok): $miss"

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang lld pkg-config \
            libssl-dev libffi-dev zlib1g-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdrm-dev \
            python3 python3-venv python3-dev rsync zstd

      - name: Setup uv + python
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          uv python list | head -5

      - name: Sync dependencies
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
          export UV_PYTHON_PREFERENCE=managed
          export UV_PYTHON=3.12
          uv sync --frozen --no-dev --python 3.12 2>&1 | tail -40
          source .venv/bin/activate
          python -c "import platform,sys; print('py:',sys.version.split()[0],'arch:',platform.machine())"

      - name: Enable comma hardware mode
        run: |
          set -euo pipefail
          if [ "${{ inputs.comma_hardware }}" = "true" ]; then
            sudo touch /TICI
            # SConstruct: cache_dir = '/data/scons_cache' if arch == "larch64"
            # runner 上 /data 不存在且 / 只读给非 root, 必须先建好并放开权限
            sudo mkdir -p /data/scons_cache
            sudo chown -R "$(id -u):$(id -g)" /data
            echo "scons cache: /data/scons_cache (writable)"
            echo "COMMA_HARDWARE=1 -> arch=larch64, camerad included"
          else
            echo "COMMA_HARDWARE=0 -> generic aarch64 (camerad skipped)"
          fi

      - name: Build
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH="${PYTHONPATH:-}:$PWD"
          export CI=1
          scons -j"${{ inputs.scons_jobs }}" --minimal 2>&1 | tee /tmp/build.log | tail -150

      - name: Smoke test
        if: success()
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export PYTHONPATH="${PYTHONPATH:-}:$PWD"
          echo "=== 产物 ==="
          find . -path ./.git -prune -o -path ./.venv -prune -o \
            -type f \( -name '*.so' -o -name '*.a' -o -name '*.elf' \) -print | head -40
          echo "=== 架构校验 ==="
          for f in $(find . -maxdepth 4 -type f -name '*.so' | head -5); do file "$f"; done

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -path ./.git -prune -o -path ./.venv -prune -o \
            -type f \( -name '*.so' -o -name '*.a' -o -name '*.elf' \) -print \
            | grep -vE 'site-packages|third_party/(acados|eigen)/' \
            | while read -r f; do
                d="dist/$(dirname "$f")"; mkdir -p "$d"; cp "$f" "$d/" 2>/dev/null || true
              done
          echo "files: $(find dist -type f | wc -l)"; du -sh dist || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragonpilot-arm64-${{ inputs.ref || 'pre-build' }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup /TICI
        if: always()
        run: sudo rm -f /TICI || true
