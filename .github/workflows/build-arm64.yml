name: build-arm64

# openpilot/sunnypilot 原生部分编译。
# 关键约束（来自 SConstruct）：
#   1. arch 只接受 comma_arm64 / aarch64 / x86_64 / Darwin
#   2. aarch64 且存在 /AGNOS 才走 comma_arm64 分支（-mcpu=cortex-a57）
#   3. 依赖均为 comma-deps-* 二进制 wheel，必须装到同架构的 Python 里
# 结论：不能直接在 x86_64 runner 上交叉编出 ARM64；
#       这里用 QEMU binfmt + arm64 容器在原生 aarch64 环境下编。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标: qemu-arm64(跨架构, 产物给 6T) 或 native-x64'
        required: false
        default: 'qemu-arm64'
      comma_hardware:
        description: '是否伪装 comma 硬件(创建 /AGNOS, 启用 cortex-a57)'
        required: false
        default: 'false'
      scons_jobs:
        description: '并发数'
        required: false
        default: '4'
  push:
    branches: [master, main, 3xl]
    paths:
      - 'SConstruct'
      - 'SConstruct.*'
      - 'pyproject.toml'
      - '.github/workflows/build-arm64.yml'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12.13'
  UV_VERSION: '0.5.11'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-user-static binfmt-support ca-certificates curl file zstd

      - name: Enable QEMU binfmt (aarch64)
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64 || true

      - name: Build inside arm64 container
        if: inputs.target != 'native-x64'
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.build-home"
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":"/openpilot" \
            -w /openpilot \
            -e CI=1 \
            -e COMMA_HARDWARE_INPUT="${{ inputs.comma_hardware }}" \
            -e SCONS_JOBS="${{ inputs.scons_jobs }}" \
            -e UV_VERSION="${{ env.UV_VERSION }}" \
            arm64v8/debian:trixie-slim \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                build-essential clang lld curl ca-certificates git \
                pkg-config libssl-dev libffi-dev zlib1g-dev \
                libgles2-mesa-dev libegl1-mesa-dev libdrm-dev \
                python3 python3-venv python3-dev

              # 用 uv 装 uv 管理的 Python 3.12（comma-deps wheel 需匹配解释器）
              curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
              export PATH="$HOME/.local/bin:$PATH"

              export UV_PROJECT_ENVIRONMENT=/openpilot/.venv
              export UV_PYTHON_PREFERENCE=managed
              uv python install 3.12.13 || uv python install 3.12
              uv sync --frozen --no-dev

              # comma 硬件分支需要 /AGNOS 存在才会启用 cortex-a57
              if [ "${COMMA_HARDWARE_INPUT}" = "true" ]; then
                touch /AGNOS
                echo "COMMA_HARDWARE=1 (/AGNOS created)"
              fi

              source .venv/bin/activate
              python -c "import platform; print(\"python arch:\", platform.machine())"
              uname -m

              export PYTHONPATH="$PYTHONPATH:/openpilot"
              scons -j"${SCONS_JOBS}" --minimal 2>&1 | tail -100

              echo "=== artifacts ==="
              find . -maxdepth 3 -name "*.so" -o -maxdepth 3 -name "*.a" 2>/dev/null | head -50
            '

      - name: Build native (x86_64, for reference)
        if: inputs.target == 'native-x64'
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
          export UV_PYTHON_PREFERENCE=managed
          uv python install 3.12.13 || uv python install 3.12
          uv sync --frozen --no-dev
          source .venv/bin/activate
          export PYTHONPATH="$PYTHONPATH:$PWD"
          scons -j"${{ inputs.scons_jobs }}" --minimal 2>&1 | tail -100

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          # .so/.a 是设备上真正要用的产物
          find . -path ./.git -prune -o -type f \( -name '*.so' -o -name '*.a' \) -print \
            | grep -vE '\.venv|site-packages|third_party/(acados|eigen)' \
            | while read -r f; do
                d="dist/$(dirname "$f")"
                mkdir -p "$d"
                cp "$f" "$d/" 2>/dev/null || true
              done
          echo "=== collected ==="
          find dist -type f | wc -l
          du -sh dist || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpilot-native-${{ inputs.target || 'qemu-arm64' }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .sconsign.dblite
          if-no-files-found: ignore
          retention-days: 7
